    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.10"/></filter>
    <style>
      :root { color-scheme: light dark; --canvas:#f8fafc; --ink:#172033; --muted:#667085; --line:#98a2b3; --card:#fff; --backend-row:#eaf2ff; --runtime-row:#f0edff; --hardware-row:#eaf8ee; --lm7:#172554; --lm7-ink:#fff; --backend-accent:#2563eb; --runtime-accent:#7c3aed; --hardware-accent:#16803c; --chip:#eef2f7; }
      @media (prefers-color-scheme: dark) { :root { --canvas:#0d1117; --ink:#f0f3f6; --muted:#a7b0bf; --line:#566173; --card:#161b22; --backend-row:#10213d; --runtime-row:#21173b; --hardware-row:#102c1b; --lm7:#dbeafe; --lm7-ink:#111827; --backend-accent:#77a7ff; --runtime-accent:#c39bff; --hardware-accent:#74d991; --chip:#252c36; } }
      text { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); }
      .canvas{fill:var(--canvas)} .row{stroke-width:1.5} .backend-row{fill:var(--backend-row);stroke:var(--backend-accent)} .runtime-row{fill:var(--runtime-row);stroke:var(--runtime-accent)} .hardware-row{fill:var(--hardware-row);stroke:var(--hardware-accent)}
      .layer-label{font-size:16px;font-weight:750;letter-spacing:1.4px;fill:var(--muted)} .layer-number{font-size:32px;font-weight:800;fill:var(--line)}
      .model{fill:var(--card);stroke:var(--line);stroke-width:2}.model-title{font-size:28px;font-weight:760}.model-sub{font-size:17px;fill:var(--muted)}
      .lm7{fill:var(--lm7)} .lm7-title{font-size:34px;font-weight:800;fill:var(--lm7-ink)} .lm7-sub{font-size:16px;fill:var(--lm7-ink);opacity:.78}.api-pill{fill:var(--canvas);opacity:.96}.api-text{font-size:18px;font-weight:750;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.lm7-feature{font-size:16px;font-weight:650;fill:var(--lm7-ink)}
      .card{fill:var(--card);stroke:var(--line);stroke-width:1.4}.card-head{font-size:19px;font-weight:760;text-anchor:middle}.card-copy{font-size:15px;font-weight:600;text-anchor:middle;fill:var(--ink)}.runtime-copy{font-size:16px;font-weight:650;text-anchor:middle}.hardware-title{font-size:18px;font-weight:760;text-anchor:middle}.hardware-sub{font-size:14px;fill:var(--muted);text-anchor:middle}
      .flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.trunk{fill:none;stroke:var(--line);stroke-width:2}.arrow-head{fill:var(--line)}
      .pytorch{fill:#ee4c2c}.nvidia{fill:#76b900}.amd{fill:#ed1c24}.intel{fill:#0071c5}.apple{fill:var(--ink)}.google{fill:#4285f4}.qualcomm{fill:#3253dc}.arm{fill:#0091bd}.brand-row{fill:var(--chip)}
    </style>
  </defs>

