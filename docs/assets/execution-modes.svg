<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="title desc">
  <title id="title">LM7 compile and export execution modes</title>
  <desc id="desc">A PyTorch model can become an in-process callable through lm7.compile or a persistent artifact through lm7.export. The compile path is lazy and may invoke a JIT compiler or transient AOT compiler on first call. The export path captures a graph and may optionally lower it to a persistent backend payload.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" class="arrow-head"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.10"/></filter>
    <style>
      :root { color-scheme:light dark; --canvas:#f8fafc; --ink:#172033; --muted:#667085; --line:#98a2b3; --card:#fff; --compile:#2563eb; --compile-soft:#eaf2ff; --export:#7c3aed; --export-soft:#f1eafe; --neutral:#eef2f7; }
      @media (prefers-color-scheme:dark) { :root { --canvas:#0d1117; --ink:#f0f3f6; --muted:#a7b0bf; --line:#566173; --card:#161b22; --compile:#77a7ff; --compile-soft:#10213d; --export:#c39bff; --export-soft:#21173b; --neutral:#252c36; } }
      text { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); }
      .canvas{fill:var(--canvas)} .model{fill:var(--card);stroke:var(--line);stroke-width:2}.model-title{font-size:24px;font-weight:750;text-anchor:middle}.model-sub{font-size:15px;fill:var(--muted);text-anchor:middle}
      .panel{fill:var(--card);stroke-width:2}.compile-panel{stroke:var(--compile)}.export-panel{stroke:var(--export)}.header-compile{fill:var(--compile)}.header-export{fill:var(--export)}.header-text{font-size:25px;font-weight:780;fill:var(--canvas)}
      .badge{fill:var(--canvas);opacity:.96}.badge-text{font-size:13px;font-weight:760;letter-spacing:.7px;text-anchor:middle;dominant-baseline:middle}.step{fill:var(--neutral);stroke:var(--line);stroke-width:1}.step-title{font-size:18px;font-weight:740;text-anchor:middle}.step-sub{font-size:14px;fill:var(--muted);text-anchor:middle}.branch{fill:var(--canvas);stroke-width:1.5}.branch-compile{stroke:var(--compile)}.branch-export{stroke:var(--export)}.branch-title{font-size:17px;font-weight:750;text-anchor:middle}.branch-copy{font-size:14px;fill:var(--muted);text-anchor:middle}
      .result-compile{fill:var(--compile-soft);stroke:var(--compile);stroke-width:1.5}.result-export{fill:var(--export-soft);stroke:var(--export);stroke-width:1.5}.result-title{font-size:18px;font-weight:760;text-anchor:middle}.result-sub{font-size:14px;fill:var(--muted);text-anchor:middle}
      .flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.trunk{fill:none;stroke:var(--line);stroke-width:2}.arrow-head{fill:var(--line)}.axis{fill:var(--card);stroke:var(--line);stroke-width:1.5}.axis-title{font-size:16px;font-weight:760}.axis-copy{font-size:15px;fill:var(--muted)}
    </style>
  </defs>

  <rect class="canvas" width="1320" height="700" rx="22"/>
  <rect class="model" x="485" y="24" width="350" height="74" rx="17" filter="url(#shadow)"/>
  <text class="model-title" x="660" y="57">PyTorch model</text><text class="model-sub" x="660" y="80">same source model, different API outcome</text>
  <path class="trunk" d="M660 98 V124 H340"/><path class="trunk" d="M660 124 H980"/><path class="flow" d="M340 124 V146"/><path class="flow" d="M980 124 V146"/>

  <rect class="panel compile-panel" x="35" y="148" width="610" height="490" rx="21" filter="url(#shadow)"/>
  <path class="header-compile" d="M56 148 H624 A21 21 0 0 1 645 169 V218 H35 V169 A21 21 0 0 1 56 148Z"/>
  <text class="header-text" x="65" y="186">lm7.compile()</text>
  <rect class="badge" x="405" y="165" width="207" height="34" rx="17"/><text class="badge-text" x="508" y="182">OUTCOME: CALLABLE</text>

  <rect class="step" x="150" y="242" width="380" height="68" rx="14"/><text class="step-title" x="340" y="269">Return a lazy CompiledModule</text><text class="step-sub" x="340" y="292">no compiler work yet</text>
  <path class="flow" d="M340 310 V338"/>
  <rect class="step" x="150" y="340" width="380" height="68" rx="14"/><text class="step-title" x="340" y="367">First call or new input signature</text><text class="step-sub" x="340" y="390">select backend, compile, then execute</text>
  <path class="trunk" d="M340 408 V430 H190"/><path class="trunk" d="M340 430 H490"/><path class="flow" d="M190 430 V447"/><path class="flow" d="M490 430 V447"/>
  <rect class="branch branch-compile" x="65" y="449" width="250" height="82" rx="13"/><text class="branch-title" x="190" y="476">JIT code generation</text><text class="branch-copy" x="190" y="500">Inductor · OpenXLA</text><text class="branch-copy" x="190" y="520">Tenstorrent · TVM</text>
  <rect class="branch branch-compile" x="365" y="449" width="250" height="82" rx="13"/><text class="branch-title" x="490" y="476">Transient AOT build</text><text class="branch-copy" x="490" y="500">AOTInductor · TensorRT</text><text class="branch-copy" x="490" y="520">OpenVINO · ONNX Runtime</text>
  <path class="trunk" d="M190 531 V547 H340"/><path class="trunk" d="M490 531 V547 H340"/><path class="flow" d="M340 547 V558"/>
  <rect class="result-compile" x="150" y="560" width="380" height="66" rx="14"/><text class="result-title" x="340" y="587">Process-local callable + shape cache</text><text class="result-sub" x="340" y="610">restart → backend work happens again</text>

  <rect class="panel export-panel" x="675" y="148" width="610" height="490" rx="21" filter="url(#shadow)"/>
  <path class="header-export" d="M696 148 H1264 A21 21 0 0 1 1285 169 V218 H675 V169 A21 21 0 0 1 696 148Z"/>
  <text class="header-text" x="705" y="186">lm7.export()</text>
  <rect class="badge" x="1045" y="165" width="207" height="34" rx="17"/><text class="badge-text" x="1148" y="182">OUTCOME: ARTIFACT</text>

  <rect class="step" x="790" y="242" width="380" height="68" rx="14"/><text class="step-title" x="980" y="269">Capture graph at build time</text><text class="step-sub" x="980" y="292">torch.export + example input signature</text>
  <path class="trunk" d="M980 310 V344 H830"/><path class="trunk" d="M980 344 H1130"/><path class="flow" d="M830 344 V363"/><path class="flow" d="M1130 344 V363"/>
  <rect class="branch branch-export" x="705" y="365" width="250" height="132" rx="13"/><text class="branch-title" x="830" y="394">Capture only</text><text class="branch-copy" x="830" y="420">backend="export"</text><text class="branch-copy" x="830" y="443">portable ExportedProgram</text><text class="branch-copy" x="830" y="466">.pt2 · not precompiled</text>
  <rect class="branch branch-export" x="1005" y="365" width="250" height="132" rx="13"/><text class="branch-title" x="1130" y="394">Lowered export</text><text class="branch-copy" x="1130" y="420">AOTInductor · TensorRT</text><text class="branch-copy" x="1130" y="443">OpenVINO · ONNX · IREE</text><text class="branch-copy" x="1130" y="466">LiteRT · ExecuTorch · QNN</text><text class="branch-copy" x="1130" y="489">StableHLO</text>
  <path class="trunk" d="M830 497 V523 H980"/><path class="trunk" d="M1130 497 V523 H980"/><path class="flow" d="M980 523 V558"/>
  <rect class="result-export" x="790" y="560" width="380" height="66" rx="14"/><text class="result-title" x="980" y="587">Versioned .lm7 directory</text><text class="result-sub" x="980" y="610">manifest + captured graph + optional payload</text>

  <rect class="axis" x="115" y="646" width="1090" height="40" rx="13"/>
  <text class="axis-title" x="145" y="672">Two separate questions:</text>
  <text class="axis-copy" x="330" y="672">When is backend work done?  JIT on use ↔ AOT at build time</text>
  <text class="axis-copy" x="825" y="672">What do I receive?  callable ↔ persistent files</text>
</svg>
