# Does LM7 run on RISC-V? docs/riscv.md argues it should by construction --
# `cpu:riscv64` already parses and detection reads platform.machine() -- but the
# claim had never been executed on the architecture.
#
# RISE provides free native RISC-V GitHub Actions runners to open source
# projects, so the claim is now testable. This job is deliberately staged and
# non-blocking: each step reports what it found and the job never fails the
# pull request, because the point is to learn what breaks, not to gate on it.
#
# What it cannot answer: performance. RISE runs on Scaleway EM-RV1, whose T-Head
# C910 implements the draft RVV 0.7.1 rather than ratified RVV 1.0, so upstream
# LLVM and GCC will not auto-vectorise there at all.
name: RISC-V experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/riscv-experiment.yml"
      - "docs/riscv.md"

permissions:
  contents: read

jobs:
  riscv64:
    name: RISC-V (experimental, non-blocking)
    runs-on: ubuntu-24.04-riscv
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      # Establishes the ground truth docs/riscv.md is written against: which
      # extensions this silicon actually reports, and whether "v" appears at all.
      - name: Describe the machine
        run: |
          echo "## machine"
          uname -m -r
          echo "## isa"
          grep -m4 -E 'isa|uarch|mvendorid|marchid' /proc/cpuinfo || true
          echo "## cores / memory"
          nproc
          free -h | head -2
          echo "## toolchain"
          gcc --version | head -1 || true
          cc -march=native -Q --help=target 2>/dev/null | grep -m1 -- '-march=' || true

      # `command -v` returns non-zero for every version that is absent, and the
      # loop's last iteration decides the step's exit code -- which on the first
      # run failed the step and skipped everything after it.
      - name: Report the Python that is present
        run: |
          echo "default: $(python3 --version)"
          for v in 3.10 3.11 3.12 3.13; do
            if command -v "python$v" >/dev/null 2>&1; then
              echo "found python$v: $(python$v --version)"
            else
              echo "no python$v"
            fi
          done
          exit 0

      # The runner ships CPython 3.12 only, and the one riscv64 wheel on PyPI is
      # tagged cp311, so this tries the distro package first and falls back to
      # fetching a 3.11 interpreter. Each strategy reports rather than aborting,
      # because which one works is the thing being measured.
      - name: Look for a usable riscv64 PyTorch
        id: torch
        continue-on-error: true
        run: |
          set +e
          echo "===== is torch packaged for riscv64? ====="
          apt-cache policy python3-torch 2>&1 | head -5

          echo "===== strategy 1: distro package ====="
          echo "(empty output above means python3-torch is not packaged for riscv64)"

          # The wheel is not auditwheel-repaired -- which is also why it carries
          # the wrong none-any tag -- so its shared libraries are not bundled.
          echo "===== system libraries the wheel expects ====="
          sudo apt-get update -qq
          sudo apt-get install -y libopenblas0 libgomp1 2>&1 | tail -2

          echo "===== strategy 2: CPython 3.11 via uv, then pytorch-riscv64 ====="
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install 3.11 2>&1 | tail -2
          uv venv --python 3.11 /tmp/rv 2>&1 | tail -1
          # `uv venv` does not install pip, so reach for uv's own installer.
          uv pip install --python /tmp/rv/bin/python "pytorch-riscv64==2.3.0a1" 2>&1 | tail -4
          if /tmp/rv/bin/python -c "import torch; print('torch', torch.__version__)" 2>&1 | tail -3; then
            /tmp/rv/bin/python -c "import torch" 2>/dev/null && {
              echo "PYBIN=/tmp/rv/bin/python" >> "$GITHUB_ENV"
              echo "strategy=uv-3.11" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          echo "strategy 2 failed"

          echo "no riscv64 PyTorch could be installed"
          echo "strategy=none" >> "$GITHUB_OUTPUT"
          exit 1

      # --no-deps matters: LM7 declares torch>=2.0, and letting pip resolve that
      # on riscv64 finds no wheel and starts a source build that will not finish.
      - name: Install LM7 without letting pip resolve torch
        if: steps.torch.outcome == 'success'
        continue-on-error: true
        run: |
          uv pip install --python "$PYBIN" --no-deps -e .
          uv pip install --python "$PYBIN" pytest
          "$PYBIN" -c "import lm7; print('lm7 imported')"

      # The claim under test: a RISC-V host resolves to cpu:riscv64 on its own.
      - name: Does LM7 detect this machine
        if: steps.torch.outcome == 'success'
        continue-on-error: true
        run: |
          "$PYBIN" - <<'PY'
          import platform
          from lm7.targets import parse_target
          spec = parse_target("cpu:riscv64")
          print("parsed:", spec, "| architecture:", spec.architecture)
          print("platform.machine():", platform.machine())
          import lm7
          print("detected targets:", [str(t) for t in lm7.detect_targets()])
          print("backends:", [b.name for b in lm7.backends()])
          PY

      - name: Run the target and planner tests
        if: steps.torch.outcome == 'success'
        continue-on-error: true
        run: |
          "$PYBIN" -m pytest tests/test_targets.py tests/test_planner.py -q

      - name: Try compiling something
        if: steps.torch.outcome == 'success'
        continue-on-error: true
        run: |
          "$PYBIN" - <<'PY'
          import torch, lm7
          model = torch.nn.Sequential(torch.nn.Linear(8, 16), torch.nn.ReLU(), torch.nn.Linear(16, 4)).eval()
          x = torch.randn(2, 8)
          with torch.no_grad():
              expected = model(x)
          compiled = lm7.compile(model, target="cpu")
          got = compiled(x)
          print("max abs diff vs eager:", float((got - expected).abs().max()))
          PY
