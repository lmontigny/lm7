name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy src/lm7

  # LM7's ExecuTorch artifacts are built for phones, but every automated check
  # runs on x86-64. This job is the cheap half of closing that gap: it exercises
  # the same XNNPACK lowering on real ARM64 hardware, so an ARM-specific
  # regression is caught on every commit rather than by the manual device gate
  # in docs/android-device-testing.md.
  executorch-arm64:
    name: ExecuTorch ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7 with ExecuTorch
        run: |
          # ExecuTorch's prebuilt runtime extension is linked against a specific
          # libtorch, so PyTorch is pinned to match rather than taking the
          # latest -- see docs/executorch.md. On aarch64 the default PyPI wheel
          # is already the CPU build.
          python -m pip install "torch==2.12.*"
          python -m pip install -e ".[dev,executorch]"

      - name: Report the architecture under test
        run: |
          python -c "import platform; print('machine:', platform.machine())"
          python -c "import torch; print('torch:', torch.__version__)"
          python -c "import importlib.metadata as m; print('executorch:', m.version('executorch'))"

      - name: Export a .pte and validate it against eager on ARM64
        run: python -m pytest tests/test_executorch_integration.py -q

  # GitHub's macos-26 runner is real Apple Silicon, so -- like ExecuTorch on
  # ubuntu-24.04-arm above -- this exercises actual hardware rather than a
  # mock: MPS is not a CPU fallback, it is PyTorch's Metal backend, and it was
  # previously validated by hand only (docs/tested-hardware.md) with no CI at
  # all. torch's default macOS wheel bundles MPS support, so no ROCm/CUDA-style
  # extra install step is needed here.
  apple-mps:
    name: Apple Silicon MPS
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7
        run: |
          python -m pip install torch
          python -m pip install -e ".[dev]"

      - name: Report the device under test
        run: |
          python -c "import torch; print('MPS built:', torch.backends.mps.is_built()); print('MPS available:', torch.backends.mps.is_available())"
          python -m lm7 backends

      - name: Compile and test on MPS
        run: |
          python examples/mac_mlp.py
          python -m pytest -m mps -v

  # A second macos-26 job rather than a step in apple-mps above: ExecuTorch
  # pins PyTorch to a specific release (see docs/executorch.md), which would
  # fight the latest-torch install the MPS job above wants. Unlike QNN, Core
  # ML is not deployment-only -- it is part of macOS itself -- so this is a
  # real hardware execution test, not just an export/packaging one.
  apple-coreml:
    name: Apple Core ML
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7 with ExecuTorch
        run: |
          python -m pip install -e ".[dev,executorch]"
          python -m pip install "torch==2.12.*" --index-url https://download.pytorch.org/whl/cpu

      - name: Report backend availability
        run: python -m lm7 backends

      - name: Export and execute through Core ML
        run: |
          python examples/coreml_mlp.py
          python -m pytest -m coreml -v

  # windows-2025 is a GitHub-hosted standard runner -- no larger-runner or GPU
  # plan needed. LM7 had no Windows coverage at all before this, despite
  # docs/iree-vulkan.md and docs/intel-npu.md both describing Windows-specific
  # driver behavior; this closes the CPU half of that gap. GPU-hosted runners
  # would close the rest (a real target="nvidia" job), but those are an
  # Organization-only, Team/Enterprise-Cloud-gated feature that a personal
  # repo cannot provision. ilammy/msvc-dev-cmd puts cl.exe on PATH, since
  # TorchInductor's C++ codegen needs it and the Visual Studio Build Tools
  # already on the image are not exposed to a plain shell by default.
  windows-cpu:
    name: Windows CPU
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Report the environment under test
        run: |
          python -c "import torch; print('torch:', torch.__version__)"
          python -m lm7 doctor
          python -m lm7 backends

      - name: Test
        run: python -m pytest

  # LM7 registers sixteen backends and CI exercised four: TorchInductor,
  # ExecuTorch on ARM64, MPS on Apple Silicon, and Core ML on Apple Silicon.
  # Every other backend's tests skip themselves when the package is absent, so
  # a green run said nothing about them at all -- the suite reported "46
  # skipped" and no one could tell
  # which of those mattered.
  #
  # These five install on an ordinary CPU runner, so their tests actually run.
  # What is deliberately not here: CUDA, ROCm, TPU, Tenstorrent and
  # TensorRT need hardware; QNN needs the Qualcomm AI Engine Direct SDK, which
  # is behind a login; zentorch expects an AMD host that a hosted runner does
  # not guarantee. apache-tvm *was* excluded too -- its published wheel failed
  # to import with an undefined symbol in libtvm_runtime.so -- until the `tvm`
  # extra started pinning the matching apache-tvm-ffi; see docs/tvm.md.
  backend:
    name: Backend ${{ matrix.extra }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: onnxruntime
            marker: onnxruntime
          - extra: openvino
            marker: openvino
          - extra: iree-vulkan
            marker: iree_vulkan
          # LiteRT Torch supports PyTorch >=2.4,<2.13, so this one pins instead
          # of taking the latest -- see docs/litert.md.
          - extra: litert
            marker: litert
            torch: torch==2.12.*
          - extra: tvm
            marker: tvm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7 with the ${{ matrix.extra }} extra
        run: |
          python -m pip install "${{ matrix.torch || 'torch' }}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,${{ matrix.extra }}]"

      # Reports availability per backend, so a job that installs the extra but
      # cannot import it fails here with the reason rather than as a wall of
      # skips.
      - name: Report backend availability
        run: python -m lm7 backends

      - name: Run the ${{ matrix.marker }} tests
        run: python -m pytest -m ${{ matrix.marker }} -v

  # `lm7 serve`'s reference runtime, which is the only serving runtime that
  # installs on a hosted runner. vLLM, SGLang and TensorRT-LLM all need a GPU
  # GitHub does not provide on this plan, so the `vllm` marker has no job here
  # and its tests skip -- what does run is the argument translation, which is
  # deliberately free of vLLM imports for exactly this reason.
  #
  # Not folded into the `backend` matrix above: that matrix reports `lm7
  # backends` and runs one marker, and a serving runtime is neither a compile
  # backend nor discoverable that way.
  serve:
    name: Serving reference runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7 with the serve and hf extras
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # httpx is the test client only, so it is not in any extra.
          python -m pip install -e ".[dev,serve,hf]" httpx

      - name: Report runtime availability
        run: python -m lm7 runtimes

      - name: Run the serve tests
        run: python -m pytest -m serve -v

  torchbench-compile:
    name: TorchBench CPU torch.compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # Pin TorchBench so upstream model or dependency changes cannot silently
      # change the workloads exercised by this required smoke test.
      - name: Check out TorchBench
        uses: actions/checkout@v6
        with:
          repository: pytorch/benchmark
          ref: 5e0d57f8a121fd3922ae4613cf19b269ed5aee99
          path: .torchbench

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify C++ compiler
        run: c++ --version

      - name: Install LM7 and TorchBench runtime dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip install psutil pyyaml

      - name: Cache TorchBench model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: torchbench-weights-resnet18-mobilenet-v2

      - name: Compile TorchBench models and compare with eager
        env:
          PYTHONPATH: ${{ github.workspace }}/.torchbench
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/torchinductor-cache
        run: |
          python benchmarks/torchbench_compile.py \
            resnet18 mobilenet_v2

  torchbench-transformer-compile:
    name: TorchBench CPU torch.compile (transformers, slow)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      # Pin TorchBench so upstream model or dependency changes cannot silently
      # change the workloads exercised by this test.
      - name: Check out TorchBench
        uses: actions/checkout@v6
        with:
          repository: pytorch/benchmark
          ref: 5e0d57f8a121fd3922ae4613cf19b269ed5aee99
          path: .torchbench

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify C++ compiler
        run: c++ --version

      - name: Install LM7 and TorchBench runtime dependencies
        run: |
          # torchvision is installed here, matched to the CPU torch build, so
          # that timm (which depends on torchvision) doesn't pull in a
          # PyPI default build with a mismatched ABI (torch/torchvision must
          # come from the same build).
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip install psutil pyyaml transformers==4.57.3 timm==1.0.19

      - name: Cache TorchBench model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: torchbench-weights-vit-small-patch16-224

      - name: Compile TorchBench models and compare with eager
        env:
          PYTHONPATH: ${{ github.workspace }}/.torchbench
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/torchinductor-cache
        run: |
          python benchmarks/torchbench_compile.py \
            hf_Bert timm_vision_transformer mixtral_moe_tiny

  aot-inductor:
    name: Linux CPU AOTInductor
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++
          c++ --version

      - name: Install LM7
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Compile and validate AOT artifact
        env:
          LM7_DEBUG_FAILURE_DIR: artifacts/aot-failure-debug
        run: |
          mkdir -p artifacts
          python examples/aot_mlp.py --output artifacts/model.lm7

      - name: Reload artifact in a fresh process
        run: python examples/aot_mlp.py --load artifacts/model.lm7

      - name: Upload AOT artifact and compiler debug output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-cpu-aot-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
