name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy src/lm7

  torchbench-compile:
    name: TorchBench CPU torch.compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # Pin TorchBench so upstream model or dependency changes cannot silently
      # change the workloads exercised by this required smoke test.
      - name: Check out TorchBench
        uses: actions/checkout@v6
        with:
          repository: pytorch/benchmark
          ref: 5e0d57f8a121fd3922ae4613cf19b269ed5aee99
          path: .torchbench

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify C++ compiler
        run: c++ --version

      - name: Install LM7 and TorchBench runtime dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip install psutil pyyaml

      - name: Cache TorchBench model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: torchbench-weights-resnet18-mobilenet-v2

      - name: Compile TorchBench models and compare with eager
        env:
          PYTHONPATH: ${{ github.workspace }}/.torchbench
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/torchinductor-cache
        run: |
          python benchmarks/torchbench_compile.py \
            resnet18 mobilenet_v2

  torchbench-transformer-compile:
    name: TorchBench CPU torch.compile (transformers, slow)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      # Pin TorchBench so upstream model or dependency changes cannot silently
      # change the workloads exercised by this test.
      - name: Check out TorchBench
        uses: actions/checkout@v6
        with:
          repository: pytorch/benchmark
          ref: 5e0d57f8a121fd3922ae4613cf19b269ed5aee99
          path: .torchbench

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify C++ compiler
        run: c++ --version

      - name: Install LM7 and TorchBench runtime dependencies
        run: |
          # torchvision is installed here, matched to the CPU torch build, so
          # that timm (which depends on torchvision) doesn't pull in a
          # PyPI default build with a mismatched ABI (torch/torchvision must
          # come from the same build).
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip install psutil pyyaml transformers==4.57.3 timm==1.0.19

      - name: Cache TorchBench model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: torchbench-weights-vit-small-patch16-224

      - name: Compile TorchBench models and compare with eager
        env:
          PYTHONPATH: ${{ github.workspace }}/.torchbench
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/torchinductor-cache
        run: |
          python benchmarks/torchbench_compile.py \
            hf_Bert timm_vision_transformer mixtral_moe_tiny

  aot-inductor:
    name: Linux CPU AOTInductor
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++
          c++ --version

      - name: Install LM7
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Compile and validate AOT artifact
        env:
          LM7_DEBUG_FAILURE_DIR: artifacts/aot-failure-debug
        run: |
          mkdir -p artifacts
          python examples/aot_mlp.py --output artifacts/model.lm7

      - name: Reload artifact in a fresh process
        run: python examples/aot_mlp.py --load artifacts/model.lm7

      - name: Upload AOT artifact and compiler debug output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-cpu-aot-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
