name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LM7
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  aot-inductor:
    name: Linux CPU AOTInductor
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++
          c++ --version

      - name: Install LM7
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Compile and validate AOT artifact
        env:
          LM7_DEBUG_FAILURE_DIR: artifacts/aot-failure-debug
        run: |
          mkdir -p artifacts
          python examples/aot_mlp.py --output artifacts/model.lm7

      - name: Reload artifact in a fresh process
        run: python examples/aot_mlp.py --load artifacts/model.lm7

      - name: Upload AOT artifact and compiler debug output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-cpu-aot-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
