[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lm7"
version = "0.1.0"
description = "A PyTorch-first hardware target and compiler orchestration layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
hf = ["transformers>=4.46", "safetensors>=0.4"]
tensorrt = ["torch-tensorrt==2.12.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lm7"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "cuda: requires a CUDA-capable NVIDIA GPU",
    "rocm: requires a ROCm-capable AMD GPU",
    "hf: requires Hugging Face model downloads and a CUDA GPU",
    "tensorrt: requires Torch-TensorRT and a CUDA-capable NVIDIA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"
