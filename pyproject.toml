[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lm7"
version = "0.1.0"
description = "A PyTorch-first hardware target and compiler orchestration layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = ["torch>=2.0"]

[project.scripts]
lm7 = "lm7.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
hf = ["transformers>=4.52.3", "safetensors>=0.4"]
# The HTTP surface for `lm7 model serve`, and nothing else: no serving engine,
# no scheduler, no tokenizer. Pure-Python wheels on every platform, so unlike
# most extras here this one installs anywhere -- but it stays optional because
# `import lm7` must not pull in a web framework. `httpx` is FastAPI's test
# client transport, needed to exercise the routes at all.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.7,<3",
    "httpx>=0.27",
]
# Diffusion pipelines. `diffusers` brings the UNet/VAE/scheduler definitions and
# the config-only `model_index.json` reader LM7 uses to recognize a pipeline
# without downloading weights; the tokenizer and text encoder are Transformers'.
diffusion = [
    "diffusers>=0.31,<1",
    "transformers>=4.52.3",
    "safetensors>=0.4",
    "pillow>=10",
]
torchao = ["torchao==0.17.0"]
onnxruntime = [
    "onnxruntime>=1.23,<2",
    "onnx>=1.19,<2",
    "onnxscript>=0.5,<1",
    "numpy>=1.26,<2.5",
]
onnxruntime-gpu = [
    "onnxruntime-gpu>=1.27,<2",
    "onnx>=1.19,<2",
    "onnxscript>=0.5,<1",
    "numpy>=1.26,<2.5",
]
tensorrt = ["torch-tensorrt==2.12.1"]
openvino = ["openvino>=2025.0", "nncf>=2.14"]
# AMD's ZenDNN PyTorch extension, the AMD-CPU counterpart to the openvino extra.
# Its version tracks the PyTorch it is built against (zentorch 2.13.x pairs with
# torch 2.13), and it publishes x86-64 Linux wheels only -- see docs/zentorch.md.
zentorch = ["zentorch>=2.13,<3"]
iree-vulkan = [
    "iree-turbine>=3.9,<4",
    "iree-base-compiler>=3.11,<4",
    "iree-base-runtime>=3.11,<4",
    "numpy>=1.26,<2.5",
]
litert = [
    "litert-torch>=0.9.2,<0.10",
    "torch>=2.4,<2.13",
    "numpy>=1.26,<2.5",
]
# AOTInductor compiles a C++ wrapper against the CUDA headers, which the PyTorch
# CUDA wheel does not ship. These wheels unpack into the same nvidia/cu13 tree,
# so LM7 finds one complete toolkit. CUDA 12 PyTorch builds need the *-cu12
# packages instead, and a system CUDA toolkit works too — see docs/development.md.
cuda-aot = [
    "nvidia-cuda-nvcc>=13.0",
    "nvidia-cuda-crt>=13.0",
    "nvidia-cuda-cccl>=13.0",
]
openxla = ["torch_xla[tpu]==2.9.0"]
# The StableHLO lowering ships in torch_xla, which is ABI-tied to a matching
# PyTorch, so this extra needs an environment built around that pair rather
# than the latest torch -- see docs/stablehlo-pjrt-evaluation.md.
stablehlo = ["torch_xla==2.9.0"]
# pjrt-plugin-tt ships from Tenstorrent's own index, not PyPI, and pulls in the
# matching torch-xla, tt-mlir, and tt-metal payload. Installing this extra needs
# "--extra-index-url https://pypi.eng.aws.tenstorrent.com/" — see
# docs/tenstorrent.md.
tenstorrent = ["pjrt-plugin-tt"]
# ExecuTorch's prebuilt runtime extension is ABI-linked to libtorch, so this
# extra needs an environment built around the matching PyTorch rather than the
# latest one -- see docs/executorch.md.
executorch = ["executorch>=1.3,<2"]
# Relax-era TVM only. LM7 does not use PyTorch's built-in `tvm` dynamo backend,
# which still targets the removed Relay API -- see docs/tvm.md. The published
# 0.25.0.post1 wheel bundles a libtvm_runtime built against apache-tvm-ffi
# 0.1.12; pip's unpinned resolve picks the newest tvm-ffi instead (0.1.13
# changed the Stringify ABI), so the runtime fails to dlopen with an undefined
# symbol -- pinning here is what makes `pip install -e ".[tvm]"` work at all.
tvm = ["apache-tvm>=0.25,<1", "apache-tvm-ffi==0.1.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/lm7"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "cpu: exercises a real CPU compiler backend",
    "cuda: requires a CUDA-capable NVIDIA GPU",
    "rocm: requires a ROCm-capable AMD GPU",
    "mps: requires an Apple Silicon GPU with Metal (MPS)",
    "hf: requires Hugging Face model downloads and a CUDA GPU",
    "tensorrt: requires Torch-TensorRT and a CUDA-capable NVIDIA GPU",
    "openvino: requires the OpenVINO runtime",
    "onnxruntime: requires ONNX exporter packages and ONNX Runtime",
    "iree_vulkan: requires IREE compiler/runtime packages; execution also requires Vulkan",
    "litert: requires LiteRT Torch and a PyTorch version supported by its converter",
    "stablehlo: requires PyTorch/XLA for the StableHLO lowering",
    "tpu: requires PyTorch/XLA on a Google TPU VM",
    "tenstorrent: requires the tt-xla PJRT plugin and a Tenstorrent card",
    "executorch: requires the ExecuTorch runtime and a matching PyTorch",
    "coreml: requires the ExecuTorch Core ML backend on macOS",
    "tvm: requires Apache TVM with the Relax PyTorch frontend",
    "zentorch: requires AMD's zentorch extension on an x86-64 CPU",
    "serve: requires the FastAPI/Uvicorn HTTP stack from the serve extra",
    "serve_load: requires the serve and hf extras, and downloads a tiny model",
    "trtllm: requires trtllm-serve on PATH and an Ampere-or-newer NVIDIA GPU",
    "export_decode: requires the hf extra, and downloads a tiny model to export a decode step",
    "diffusion: requires the diffusion extra, and downloads a tiny diffusion pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

# The `serve` extra is the only optional dependency LM7 imports with a plain
# `import` statement rather than through `importlib.import_module`, so it is the
# only one mypy tries to resolve -- and CI type-checks a `[dev]` install, where
# it is absent. When the extra *is* installed these are checked against the real
# stubs; when it is not, they fall back to Any instead of failing the run.
[[tool.mypy.overrides]]
module = ["fastapi.*", "pydantic.*", "uvicorn.*"]
ignore_missing_imports = true
