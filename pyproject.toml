[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lm7"
version = "0.1.0"
description = "A PyTorch-first hardware target and compiler orchestration layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = ["torch>=2.0"]

[project.scripts]
lm7 = "lm7.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
hf = ["transformers>=4.52.3", "safetensors>=0.4"]
torchao = ["torchao==0.17.0"]
tensorrt = ["torch-tensorrt==2.12.1"]
openvino = ["openvino>=2025.0"]
iree-vulkan = [
    "iree-turbine>=3.9,<4",
    "iree-base-compiler>=3.11,<4",
    "iree-base-runtime>=3.11,<4",
    "numpy>=1.26,<2.5",
]
# AOTInductor compiles a C++ wrapper against the CUDA headers, which the PyTorch
# CUDA wheel does not ship. These wheels unpack into the same nvidia/cu13 tree,
# so LM7 finds one complete toolkit. CUDA 12 PyTorch builds need the *-cu12
# packages instead, and a system CUDA toolkit works too — see docs/development.md.
cuda-aot = [
    "nvidia-cuda-nvcc>=13.0",
    "nvidia-cuda-crt>=13.0",
    "nvidia-cuda-cccl>=13.0",
]
openxla = ["torch_xla[tpu]==2.9.0"]
# The StableHLO lowering ships in torch_xla, which is ABI-tied to a matching
# PyTorch, so this extra needs an environment built around that pair rather
# than the latest torch -- see docs/stablehlo-pjrt-evaluation.md.
stablehlo = ["torch_xla==2.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lm7"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "cpu: exercises a real CPU compiler backend",
    "cuda: requires a CUDA-capable NVIDIA GPU",
    "rocm: requires a ROCm-capable AMD GPU",
    "mps: requires an Apple Silicon GPU with Metal (MPS)",
    "hf: requires Hugging Face model downloads and a CUDA GPU",
    "tensorrt: requires Torch-TensorRT and a CUDA-capable NVIDIA GPU",
    "openvino: requires the OpenVINO runtime",
    "iree_vulkan: requires IREE compiler/runtime packages; execution also requires Vulkan",
    "stablehlo: requires PyTorch/XLA for the StableHLO lowering",
    "tpu: requires PyTorch/XLA on a Google TPU VM",
]

[tool.ruff]
line-length = 100
target-version = "py310"
