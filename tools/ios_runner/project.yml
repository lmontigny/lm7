name: LM7Validator
options:
  bundleIdPrefix: com.lm7
  deploymentTarget:
    iOS: "17.0"
packages:
  # Must match the executorch pip version used to export the .pte.
  ExecuTorch:
    url: https://github.com/pytorch/executorch.git
    branch: swiftpm-1.3.1
targets:
  LM7Validator:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ExecuTorch
        product: executorch
      - package: ExecuTorch
        product: backend_coreml
      - package: ExecuTorch
        product: kernels_optimized
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LM7Validator
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lm7.validator
        TARGETED_DEVICE_FAMILY: 1
        # ExecuTorch ships static libraries; backends and kernels register
        # themselves at load time and are stripped without this.
        OTHER_LDFLAGS: -all_load
